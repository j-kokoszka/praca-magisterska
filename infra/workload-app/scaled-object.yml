apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: workload-app-so
  namespace: default
spec:
  scaleTargetRef:
    name: workload-app            # nazwa Deploymentu / StatefulSetu
  minReplicaCount: 1
  maxReplicaCount: 10

  cooldownPeriod: 5              # (opcjonalnie) czas wygaszania skalowania
  pollingInterval: 2             # (opcjonalnie) jak często KEDA odpala query

  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15

  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: istio_requests_total
        query: |
          sum(rate(istio_requests_total{service="workload-app-service"}[5s]))
        threshold: "50"           
#     - type: kubernetes-metrics
#       metadata:
#         # Typ pomiaru: Celuj w średnie wykorzystanie CPU.
#         metricName: cpu
#         # Cel, jaki ma osiągnąć obciążenie CPU.
#         # Wartość "80" oznacza 80% rdzenia.
#         targetAverageValue: "80"
#         # Typ pomiaru: Wartość średnia (AverageValue) to standard dla CPU.
#         operator: average
